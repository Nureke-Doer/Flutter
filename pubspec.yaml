name: habit_study_tracker
description: "Habit & Study Tracker — трекер привычек и учебных целей."
publish_to: 'none'
version: 0.8.0+8

environment:
  sdk: ^3.8.0

dependencies:
  bloc_concurrency: ^0.3.0
  cloud_firestore: ^6.10.0
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
