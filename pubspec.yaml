  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  stream_transform: ^2.1.2
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
