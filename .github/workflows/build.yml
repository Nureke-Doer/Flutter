# Сборка и проверка приложения при каждом пуше:
# анализ, форматирование, тесты, APK для Android и web-версия на GitHub Pages.
name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # для публикации APK в Releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Установка зависимостей
        run: flutter pub get

      - name: Проверка форматирования
        run: dart format --output=none --set-exit-if-changed lib test dart_tasks

      - name: Статический анализ
        run: flutter analyze

      - name: Тесты
        run: flutter test --coverage

      - name: Сборка APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk habit-study-tracker.apk

      - name: Сборка web-версии
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - uses: actions/upload-artifact@v4
        with:
          name: habit-study-tracker-apk
          path: habit-study-tracker.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Публикация APK в Releases
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка №${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: habit-study-tracker.apk
          body: |
            Автоматическая сборка из коммита ${{ github.sha }}.
            Скачай `habit-study-tracker.apk` на Android-телефон и установи
            (разреши установку из неизвестных источников).

  # Web-версия: https://<user>.github.io/<repo>/
  # Требуется один раз включить: Settings → Pages → Source: GitHub Actions.
  deploy-web:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    continue-on-error: true # не «краснеть», пока Pages не включены
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
